var FAQS=[
{id:"f1",c:"General",q:"What types of properties can I enquire about?",a:"Through King Zion's Estate, you can enquire about houses for sale (including detached duplexes, semi-detached duplexes, terrace houses, and bungalows), residential land plots, short-stay and long-term rental apartments or homes, as well as our Phase 1 (Asaba) and Phase 2 (Ibusa) estate projects."},
{id:"f2",c:"Inspection",q:"How can I request a property inspection?",a:"You can click \"Request an Inspection\" from the homepage, any property details panel, the Estate Projects page, or go directly to the Contact page and choose \"Inspection Request\". Submitting a request logs your preferred date and time; our team will contact you to confirm an available appointment."},
{id:"f3",c:"Land",q:"Can I enquire about land in Asaba or Ibusa?",a:"Yes. We handle enquiries for residential land plots in Asaba (including King Zion Estate Phase 1) and Ibusa (including King Zion Estate Phase 2), as well as other available locations. Specific plot sizes, documentation, and current availability are confirmed for each individual parcel."},
{id:"f4",c:"General",q:"How do I enquire about a property price?",a:"Some listings display an indicative or confirmed asking price, while others state \"Price on enquiry\". You may open any listing's details panel and submit a Purchase or Rental Enquiry via the Contact page so our team can provide the confirmed current price and applicable terms."},
{id:"f5",c:"General",q:"Can I request a property that is not currently displayed?",a:"Yes. On the Properties page (\"Can't Find What You Need?\") or on the Contact page under \"Custom Property Request\", you can describe your preferred category, location, budget range, and specifications. Our team will review your request and contact you if a suitable option is identified."},
{id:"f6",c:"Rentals",q:"Can I rent a property for a short stay or a longer period?",a:"Yes. Our Rentals tab and Rental Enquiry form support both Short-Stay Rentals (nightly, weekly, monthly, or other agreed duration) and Long-Term Rentals (one year, two years, three years, or other agreed duration). Available durations and billing periods depend on the specific property."},
{id:"f7",c:"Documentation",q:"What documents should I request and review before purchasing land or a house?",a:"Before completing any purchase, you should request and independently verify the specific title and survey documents applicable to that property \u2014 such as the Survey Plan, Deed of Assignment or Conveyance, Certificate of Occupancy (C of O) or Governor's Consent where applicable, and relevant layout/building approvals. Property documentation varies by property and must be reviewed and confirmed for each individual transaction."},
{id:"f8",c:"General",q:"How do I know if a property or estate unit is still available?",a:"Published listings display their current recorded status (such as For Sale, For Rent, or Land). For estate developments like Phase 1 (Asaba) and Phase 2 (Ibusa), stated project counts represent total inventory rather than guaranteed remaining units. Always contact our team to confirm real-time availability before making commitments."}

if(pay.preferredLocation)lines.push("Location: "+pay.preferredLocation);
if(pay.budget)lines.push("Budget: "+pay.budget);
if(pay.preferredHouseType)lines.push("House Type: "+pay.preferredHouseType);
if(pay.bedrooms)lines.push("Bedrooms: "+pay.bedrooms);
if(pay.bedroomPreference)lines.push("Bedrooms: "+pay.bedroomPreference);
if(pay.preferredPlotSize)lines.push("Plot Size: "+pay.preferredPlotSize);

if(pay.rentalDuration)lines.push("Duration: "+pay.rentalDuration);

if(pay.alternativeDate)lines.push("Alternative Date: "+pay.alternativeDate);
if(pay.preferredTime)lines.push("Preferred Time: "+pay.preferredTime);
